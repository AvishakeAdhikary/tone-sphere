title: ToneSphere
tagline: Route any audio anywhere. Low-latency audio routing, mixing and VST3 hosting for Windows and Linux
description: >-
  ToneSphere is a free, open-source desktop audio router and mixer for Windows and Linux,
  published by Neural Nexus Studios. It routes and processes audio on your own machine:
  devices, applications, virtual cables, mixes, effects and VST3 plugins. This site carries
  its Terms and Conditions, Terms of Service and Privacy Policy.
author: Neural Nexus Studios
lang: en

url: https://avishakeadhikary.github.io
baseurl: /tone-sphere

theme: minima
github_username: AvishakeAdhikary

# Listed explicitly rather than left to the theme's gemspec: minima's head and footer call
# `seo` and `feed_meta`, and a plugin that is not loaded makes those a build error rather
# than a missing meta tag.
plugins:
  - jekyll-seo-tag
  - jekyll-feed

# Owner-facing runbooks that live in docs/ for proximity to what they describe, but are not
# pages of the public site: excluded so Jekyll does not serve them, rather than given front
# matter and a nav entry nobody visiting a legal page is looking for.
exclude:
  - parity.md

# Without this, minima's nav lists every page that has a title, which would put the landing
# page into its own navigation bar next to the site title that already links there.
header_pages:
  - STATUS.md
  - DEVELOPMENT.md
  - legal/terms-and-conditions.md
  - legal/terms-of-service.md
  - legal/privacy-policy.md
