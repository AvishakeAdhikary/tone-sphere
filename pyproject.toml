[project]
name = "tone-sphere"
version = "0.1.0"
# Describes what this is, not what it aspires to. The previous description claimed a
# "complete audio routing system"; it passes no audio yet. See the Roadmap in README.md.
description = "Audio routing and mixing for Windows, Linux and macOS. Pre-alpha: no audio path yet."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.117.1",
    "numpy>=2.3.3",
    "pydantic>=2.11.9",
    "pyinstaller>=6.16.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "sounddevice>=0.5.2",
    "uvicorn>=0.37.0",
    "websockets>=15.0.1",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: needs a real audio device; skipped on CI runners, which have none",
]
