[project]
name = "tone-sphere"
version = "0.1.0"
# Describes what this is, not what it aspires to. The previous description claimed a
# "complete audio routing system"; it passes no audio yet. See the Roadmap in README.md.
description = "Low-latency audio routing and mixing for Windows, Linux and macOS."
readme = "README.md"
requires-python = ">=3.13"
# Runtime only. Why each one is here, and what could replace it, is in
# docs/DEPENDENCIES.md — update that file when this list changes.
dependencies = [
    "fastapi>=0.117.1",
    "numpy>=2.3.3",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.2",
    "sounddevice>=0.5.2",
    "uvicorn>=0.37.0",
    "websockets>=15.0.1",
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
# Building the frozen app and the Store package. Pillow is used only by
# packaging/msix/generate_assets.py, never by the application.
packaging = [
    "pyinstaller>=6.16.0",
    "pillow>=10.0.0",
]
# The native build's generator tools, from PyPI so no system install is needed. The
# compiler itself comes from the EWDK — see docs/BUILDING_WINDOWS.md.
native = [
    "cmake>=3.31",
    "ninja>=1.11",
]

[tool.uv]
# A source checkout should build, package and test with a plain `uv sync`; the groups
# exist to keep runtime dependencies honest, not to add install steps.
default-groups = ["dev", "packaging", "native"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: needs a real audio device; skipped on CI runners, which have none",
    "linux_virtual_sink: needs Linux with a running PulseAudio/PipeWire server; unlike hardware, CI can provide this (see the pulseaudio setup step in ci.yml), so these are not excluded from the CI run — only self-skipped off Linux.",
]

[tool.ruff]
target-version = "py313"
# 120, not the default 88. This codebase's comments are prose explaining *why*, not
# clipped one-liners, and its longest line — an unavoidably atomic logging format
# string — sits at 112; 100 would have forced ~20 lines (log formats, f-strings,
# a couple of signatures) into awkward wraps that read worse than the overflow did,
# for zero readability gain. 120 reflects the width this code already settled at
# rather than loosening a check that would otherwise catch something real.
line-length = 120
exclude = ["dist", "build", "presets"]

[tool.ruff.lint]
# Correctness and real bugs, not house style:
#   F   pyflakes      — unused imports/names, undefined names, real mistakes
#   E/W pycodestyle   — the parts of PEP 8 that catch actual errors
#   B   bugbear       — mutable default args, loop-variable-in-closure, and similar
#                       footguns that are easy to write and hard to spot in review
#   UP  pyupgrade     — flags syntax older than the declared target-version
#   I   isort         — import order and grouping
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E402",   # a handful of modules import mid-file on purpose (optional deps, lazy
              # imports to avoid pulling in PortAudio/Qt just for a type check)
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally build throwaway fixture objects inline and import some modules only
# after checking availability at runtime, not at module load.
"tests/*" = ["E402"]
