name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Separate from the test matrix: ruff is pure Python and its verdict does not depend
    # on the OS, so running it three times would just be paying the same check three
    # times over instead of once.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ruff
        run: uv run ruff check .

  test:
    # Run on all three so a platform-specific import can never silently rot again.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install native runtime libraries
        # Two things the Linux runner doesn't ship that the Python wheels assume exist:
        #   - PySide6 needs X11/EGL libraries; without them every UI test errors on
        #     import rather than on anything real.
        #   - The `sounddevice` wheel does NOT bundle libportaudio.so on Linux (unlike
        #     the Windows/macOS wheels, which do) — it's a thin ctypes wrapper that calls
        #     ctypes.util.find_library('portaudio') at import time. Without the system
        #     package, AudioHost can't even enumerate devices, and every engine test that
        #     merely constructs one fails with AudioBackendUnavailable — not a code bug,
        #     a missing OS package.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1 \
            libportaudio2 libopus0

      - name: Install libopus (macOS)
        # Opus is loaded with ctypes from the system library (tonesphere/network/opus.py);
        # Windows builds it from Xiph's pinned source, Linux gets libopus0 above.
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Start a headless PulseAudio server (Linux)
        # Unlike `hardware` (needs a real sound card, which no CI runner has),
        # `linux_virtual_sink`-marked tests only need *a* running Pulse/PipeWire server —
        # a dummy one is enough to load a null-sink and prove the ALSA bridge for real, so
        # this is the one Track-2 claim CI can actually verify rather than only assert.
        # The plan flagged these exact flags as unverified until run for real here.
        #
        # Confirmed by the first two real runs: pactl reaches the daemon fine (the sink
        # loads) and libasound2-plugins + a `hint` block in the ~/.asoundrc bridge are both
        # in place, but the sink still never appeared as a PortAudio device. `aplay -L` —
        # ALSA's own enumeration, independent of PortAudio — would say whether ALSA itself
        # ever resolves the bridge at all, but alsa-utils was never installed, so every run
        # so far has been diagnosing this one-eyed. Installing it turns the next failure
        # (if there is one) into a real answer instead of another guess.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins alsa-utils
          dbus-run-session -- pulseaudio --start --exit-idle-time=-1
          sleep 2
          pactl info
          echo "--- aplay -L (ALSA's own view) ---"
          aplay -L || true

      - name: Build the native engine (Windows)
        # tests/native fails rather than skips on Windows without the DLL, so this has to
        # run first. The runner's Visual Studio is found through vswhere; CMake and Ninja
        # come from the `native` dependency group. Both SDKs are fetched (VST3 pinned by tag,
        # ASIO by checksum with its GPLv3 option verified), so the VST3 host, its test
        # plugin and the GPLv3 ASIO host are all built and tested; the runner has no ASIO
        # driver, so nothing here drives one.
        if: runner.os == 'Windows'
        run: |
          uv run python scripts/fetch_sdks.py
          uv run python scripts/build_native.py

      - name: Run tests
        # CI runners have no audio hardware, so hardware-marked tests are excluded.
        # `linux_virtual_sink`-marked tests are deliberately NOT excluded here: on Linux
        # the PulseAudio step above gives them a real server to prove Track 2 against; on
        # Windows/macOS they self-skip via `skipif(sys.platform != 'linux')`, so this one
        # selection is correct on every runner in the matrix.
        env:
          # Qt needs an offscreen platform plugin with no display attached.
          QT_QPA_PLATFORM: offscreen
        # A test stuck past ten minutes dumps every thread's stack into the log, so a hang on
        # a runner says where it is instead of only timing the job out.
        run: uv run pytest -m "not hardware" -o faulthandler_timeout=600

      - name: Check the package imports on this platform
        run: uv run python -c "import tonesphere; print(tonesphere.__version__)"

      - name: Check the CLI entry point runs
        run: uv run python main.py help

      - name: Check diagnostics run without crashing
        # Exits non-zero when it finds no hardware, which is expected on CI — we only care
        # that it runs to completion rather than raising.
        continue-on-error: true
        run: uv run python main.py test

  build-macos-plugin:
    # The whole verification story for the macOS CoreAudio HAL plug-in in
    # native/coreaudio-plugin. That C was written on a Windows machine and has never been
    # compiled, installed or listened to by its author -- this job is the first thing that
    # ever runs it, and the only evidence that it works. It does not gate `package`,
    # deliberately: the plug-in is a separate artifact from the Python app, and a plug-in
    # that fails to build must not stop the app from being packaged.
    #
    # Three of the four steps below can only pass or fail here (a build, a signature, an
    # install into a system directory), and the fourth measures real audio: a 1 kHz sine
    # written to the device and captured back from it. What this job still cannot say
    # anything about is listed in native/coreaudio-plugin/README.md -- System Settings,
    # Discord/DAW pickers, sleep/wake, Gatekeeper on a downloaded bundle.
    name: Build and prove the macOS HAL plugin
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build the plugin bundle
        working-directory: native/coreaudio-plugin
        run: make

      - name: Ad-hoc codesign the bundle
        # `codesign --sign -` is free -- no Apple Developer account, no notarisation. It is
        # enough for coreaudiod to load a locally built plug-in, and `make sign` runs
        # `codesign --verify` straight afterwards so an unsigned or badly signed bundle
        # fails here rather than silently never appearing as a device.
        working-directory: native/coreaudio-plugin
        run: make sign

      - name: Install it and restart coreaudiod
        # Restarting coreaudiod is what makes it rescan /Library/Audio/Plug-Ins/HAL. The
        # Makefile tries `launchctl kickstart -k system/com.apple.audio.coreaudiod` and
        # falls back to `killall coreaudiod`; which one this runner's macOS version
        # actually accepts is one of the things this job's log settles for the first time.
        working-directory: native/coreaudio-plugin
        run: make install

      - name: List the audio devices macOS now reports
        # Cheap, and the single most useful line in the log when the round trip fails:
        # it separates "the plug-in never loaded" from "it loaded but carries no audio".
        continue-on-error: true
        run: system_profiler SPAudioDataType

      - name: Prove the device round-trips real audio
        run: uv run python .github/scripts/macos_plugin_roundtrip.py

      - name: Uninstall the plugin
        # Always, so a failed run leaves the runner's audio stack as it found it -- and so
        # nothing later in this job could accidentally pass because of a leftover install.
        if: always()
        working-directory: native/coreaudio-plugin
        run: make uninstall

  version:
    # The version this run builds. On a push to main it is the version it releases: the
    # latest v* tag's next patch, or minor/major when the head commit says [minor]/[major]
    # (scripts/release_version.py). Everywhere else the same number labels the test builds.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: next
        run: |
          echo "version=$(python3 scripts/release_version.py next)" >> "$GITHUB_OUTPUT"
          echo "previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

  package:
    # What users download, built and then launched the way they launch it: with no
    # arguments, from the installer's own install, the AppImage, the app in the .dmg
    # (.github/scripts/smoke_test_release.py). v0.2.0 was released after a test that only
    # ever ran `ToneSphere gui`, and its exe opened nothing when double-clicked.
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Stamp the version into the build
        # Into this checkout only. From here on uv must not relock against the stamped
        # pyproject.toml.
        run: uv run python scripts/release_version.py stamp ${{ env.VERSION }}

      - name: Install native runtime libraries
        # The frozen app bundles PortAudio from here (tonesphere.spec), and Qt's xcb plugin
        # libraries; the smoke test then runs the AppImage on this machine.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1 \
            libportaudio2 libopus0

      - name: Build the native engine (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run --frozen python scripts/fetch_sdks.py
          uv run --frozen python scripts/build_native.py

      - name: Freeze with PyInstaller
        run: uv run --frozen pyinstaller --noconfirm tonesphere.spec

      - name: Build the installer and the portable zip (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION `
            /DSourceDir="$pwd\dist\ToneSphere" /DOutputDir="$pwd\release" packaging\windows\ToneSphere.iss
          Compress-Archive -Path dist\ToneSphere -DestinationPath release\ToneSphere-$env:VERSION-windows-portable.zip

      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build_appimage.sh "$VERSION"

      - name: Build the disk image (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_dmg.sh "$VERSION"

      - name: Launch what users download (Windows)
        if: runner.os == 'Windows'
        run: >
          uv run --frozen python .github/scripts/smoke_test_release.py windows
          release/ToneSphere-${{ env.VERSION }}-Setup.exe
          release/ToneSphere-${{ env.VERSION }}-windows-portable.zip
          native/build/release/VST3/Release/tonesphere_test_gain.vst3

      - name: Launch what users download (Linux)
        if: runner.os == 'Linux'
        run: uv run --frozen python .github/scripts/smoke_test_release.py linux release/ToneSphere-$VERSION-x86_64.AppImage

      - name: Launch what users download (macOS)
        if: runner.os == 'macOS'
        run: uv run --frozen python .github/scripts/smoke_test_release.py macos release/ToneSphere-$VERSION-macos.dmg

      - name: Upload the downloads
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error

      - name: Package the Corresponding Source (Windows)
        # The Windows build bundles the GPLv3 ASIO host, so it is GPLv3 as a whole and its
        # Corresponding Source (both SDKs included, never committed) must be offered with it.
        # It is published in the separate `gpl-source` release, linked from each release's
        # notes (GPLv3 section 6(d)), so the downloads list holds only what users run.
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/package_source.py release-source/ToneSphere-$env:VERSION-windows-source.zip

      - name: Upload the Corresponding Source (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gpl-source
          path: release-source/*.zip
          if-no-files-found: error

  release:
    # Every green push to main is a release: tagged here, after lint, every test and every
    # download's launch test passed, never before. One at a time, in push order.
    name: Publish GitHub Release
    needs: [lint, test, build-macos-plugin, version, package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the Corresponding Source
        run: |
          gh release view gpl-source >/dev/null 2>&1 || gh release create gpl-source --prerelease \
            --title "GPLv3 Corresponding Source (not an app download)" \
            --notes "The complete corresponding source of each Windows build of ToneSphere, which includes the GPLv3 ASIO host. To install ToneSphere, use the latest release instead."
          gh release upload gpl-source artifacts/gpl-source/*.zip --clobber

      - name: Tag and publish the release
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists: nothing to release"; exit 0
          fi
          source_url="https://github.com/${{ github.repository }}/releases/download/gpl-source/ToneSphere-$VERSION-windows-source.zip"
          python3 scripts/release_version.py notes "$VERSION" "${{ needs.version.outputs.previous }}" "$source_url" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "ToneSphere $VERSION" \
            --notes-file notes.md --latest artifacts/downloads-*/*
