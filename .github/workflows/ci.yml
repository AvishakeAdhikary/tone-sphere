name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Run on all three so a platform-specific import can never silently rot again.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        # CI runners have no audio hardware, so hardware-marked tests are excluded.
        # Everything else must pass on every platform.
        run: uv run pytest -m "not hardware"

      - name: Check the package imports on this platform
        run: uv run python -c "import tonesphere; print(tonesphere.__version__)"

      - name: Check the CLI entry point runs
        run: uv run python main.py
