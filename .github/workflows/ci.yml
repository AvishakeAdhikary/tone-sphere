name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Separate from the test matrix: ruff is pure Python and its verdict does not depend
    # on the OS, so running it three times would just be paying the same check three
    # times over instead of once.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ruff
        run: uv run ruff check .

  test:
    # Run on all three so a platform-specific import can never silently rot again.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install native runtime libraries
        # Two things the Linux runner doesn't ship that the Python wheels assume exist:
        #   - PySide6 needs X11/EGL libraries; without them every UI test errors on
        #     import rather than on anything real.
        #   - The `sounddevice` wheel does NOT bundle libportaudio.so on Linux (unlike
        #     the Windows/macOS wheels, which do) — it's a thin ctypes wrapper that calls
        #     ctypes.util.find_library('portaudio') at import time. Without the system
        #     package, AudioHost can't even enumerate devices, and every engine test that
        #     merely constructs one fails with AudioBackendUnavailable — not a code bug,
        #     a missing OS package.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1 \
            libportaudio2

      - name: Start a headless PulseAudio server (Linux)
        # Unlike `hardware` (needs a real sound card, which no CI runner has),
        # `linux_virtual_sink`-marked tests only need *a* running Pulse/PipeWire server —
        # a dummy one is enough to load a null-sink and prove the ALSA bridge for real, so
        # this is the one Track-2 claim CI can actually verify rather than only assert.
        # The plan flagged these exact flags as unverified until run for real here.
        #
        # Confirmed by the first two real runs: pactl reaches the daemon fine (the sink
        # loads) and libasound2-plugins + a `hint` block in the ~/.asoundrc bridge are both
        # in place, but the sink still never appeared as a PortAudio device. `aplay -L` —
        # ALSA's own enumeration, independent of PortAudio — would say whether ALSA itself
        # ever resolves the bridge at all, but alsa-utils was never installed, so every run
        # so far has been diagnosing this one-eyed. Installing it turns the next failure
        # (if there is one) into a real answer instead of another guess.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins alsa-utils
          dbus-run-session -- pulseaudio --start --exit-idle-time=-1
          sleep 2
          pactl info
          echo "--- aplay -L (ALSA's own view) ---"
          aplay -L || true

      - name: Run tests
        # CI runners have no audio hardware, so hardware-marked tests are excluded.
        # `linux_virtual_sink`-marked tests are deliberately NOT excluded here: on Linux
        # the PulseAudio step above gives them a real server to prove Track 2 against; on
        # Windows/macOS they self-skip via `skipif(sys.platform != 'linux')`, so this one
        # selection is correct on every runner in the matrix.
        env:
          # Qt needs an offscreen platform plugin with no display attached.
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m "not hardware"

      - name: Check the package imports on this platform
        run: uv run python -c "import tonesphere; print(tonesphere.__version__)"

      - name: Check the CLI entry point runs
        run: uv run python main.py

      - name: Check diagnostics run without crashing
        # Exits non-zero when it finds no hardware, which is expected on CI — we only care
        # that it runs to completion rather than raising.
        continue-on-error: true
        run: uv run python main.py test

  build-macos-plugin:
    # The whole verification story for the macOS CoreAudio HAL plug-in in
    # native/coreaudio-plugin. That C was written on a Windows machine and has never been
    # compiled, installed or listened to by its author -- this job is the first thing that
    # ever runs it, and the only evidence that it works. It does not gate `package`,
    # deliberately: the plug-in is a separate artifact from the Python app, and a plug-in
    # that fails to build must not stop the app from being packaged.
    #
    # Three of the four steps below can only pass or fail here (a build, a signature, an
    # install into a system directory), and the fourth measures real audio: a 1 kHz sine
    # written to the device and captured back from it. What this job still cannot say
    # anything about is listed in native/coreaudio-plugin/README.md -- System Settings,
    # Discord/DAW pickers, sleep/wake, Gatekeeper on a downloaded bundle.
    name: Build and prove the macOS HAL plugin
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build the plugin bundle
        working-directory: native/coreaudio-plugin
        run: make

      - name: Ad-hoc codesign the bundle
        # `codesign --sign -` is free -- no Apple Developer account, no notarisation. It is
        # enough for coreaudiod to load a locally built plug-in, and `make sign` runs
        # `codesign --verify` straight afterwards so an unsigned or badly signed bundle
        # fails here rather than silently never appearing as a device.
        working-directory: native/coreaudio-plugin
        run: make sign

      - name: Install it and restart coreaudiod
        # Restarting coreaudiod is what makes it rescan /Library/Audio/Plug-Ins/HAL. The
        # Makefile tries `launchctl kickstart -k system/com.apple.audio.coreaudiod` and
        # falls back to `killall coreaudiod`; which one this runner's macOS version
        # actually accepts is one of the things this job's log settles for the first time.
        working-directory: native/coreaudio-plugin
        run: make install

      - name: List the audio devices macOS now reports
        # Cheap, and the single most useful line in the log when the round trip fails:
        # it separates "the plug-in never loaded" from "it loaded but carries no audio".
        continue-on-error: true
        run: system_profiler SPAudioDataType

      - name: Prove the device round-trips real audio
        run: uv run python .github/scripts/macos_plugin_roundtrip.py

      - name: Uninstall the plugin
        # Always, so a failed run leaves the runner's audio stack as it found it -- and so
        # nothing later in this job could accidentally pass because of a leftover install.
        if: always()
        working-directory: native/coreaudio-plugin
        run: make uninstall

  package:
    # tonesphere.spec (PyInstaller) has existed at the repo root since Phase 4-5 but was
    # never actually invoked by CI, so "packaging" was an unverified claim — this job is
    # what makes it a real one: build the frozen app, launch it, and prove it doesn't
    # immediately die (the exact failure the spec's own comments say it was built to
    # prevent: a missing PortAudio/pedalboard native library) before ever calling it done.
    #
    # Built with ONEFILE=1: a user fetching "download for Windows" from a Releases page
    # expects one executable, not a zip holding 279 loose files including an `_internal`
    # DLL directory. A single self-contained binary is the release artifact; the default
    # one-folder layout tonesphere.spec still produces without ONEFILE is what
    # packaging/msix/build_msix.ps1 stages into the Store package, and stays that way
    # deliberately — see tonesphere.spec's own comment for why those are different trades.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ToneSphere-windows.exe
          - os: ubuntu-latest
            asset_name: ToneSphere-linux
          - os: macos-latest
            asset_name: ToneSphere-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install native runtime libraries
        # Same libraries and same reason as the test job above: PyInstaller's analysis
        # phase imports PySide6/sounddevice to introspect them for hooks, and the frozen
        # app the smoke-test step launches needs them at runtime too.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1 \
            libportaudio2

      - name: Build with PyInstaller (one-file)
        run: uv run pyinstaller tonesphere.spec
        env:
          ONEFILE: '1'

      - name: Smoke test the frozen app (Linux, offscreen)
        # No X server on this runner; same offscreen platform plugin the test job above
        # uses for the same reason.
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python .github/scripts/smoke_test_frozen_app.py

      - name: Smoke test the frozen app
        if: runner.os != 'Linux'
        run: uv run python .github/scripts/smoke_test_frozen_app.py

      - name: Name the executable for its platform (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/ToneSphere.exe ${{ matrix.asset_name }}

      - name: Name the executable for its platform, and mark it runnable (Linux/macOS)
        # A raw binary downloaded from a Releases page does not keep the +x bit through
        # every download path regardless of what is uploaded, so this is a courtesy, not
        # a guarantee -- documented on the release itself rather than assumed.
        if: runner.os != 'Windows'
        run: |
          cp dist/ToneSphere ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  tag-release:
    # Cutting a release is "bump the version in pyproject.toml and land it on main" --
    # nothing here decides *whether* to release, only *that* a version nobody has tagged
    # yet just did. Gated on lint/test/the plugin build so a release always represents a
    # fully green commit, and on a genuine push to main so it can never fire for a PR or
    # for the tag push this job itself makes (that push's ref is refs/tags/vX.Y.Z, which
    # this job's own `if` does not match -- one tag, not a loop).
    #
    # Pushing the tag here uses the workflow's own token, which GitHub deliberately does
    # not let re-trigger another workflow run -- so `release` below does not wait for a
    # second, tag-triggered run that would never come. It runs in *this* run instead, off
    # this job's own output, using the `package` artifacts this same run already built.
    # `startsWith(github.ref, 'refs/tags/v')` stays as the other half of that condition
    # purely so a tag pushed by hand later still works the original way.
    name: Auto-tag a release
    needs: [lint, test, build-macos-plugin]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      version_tag: ${{ steps.tag.outputs.version_tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the release if pyproject.toml's version is new
        id: tag
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v${version}"
          echo "version_tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Already tagged $tag -- no version bump since the last release."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    # Publishes the exact artifacts `package` already built and smoke-tested for this
    # commit. Fires either for a tag pushed by hand (the original, still-supported path)
    # or for the tag `tag-release` just created in this same run -- see that job's own
    # comment for why a fresh, tag-triggered run is not what this waits for.
    name: Publish GitHub Release
    needs: [package, tag-release]
    if: startsWith(github.ref, 'refs/tags/v') || needs.tag-release.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-release.outputs.version_tag || github.ref_name }}
          files: release-assets/*/*
          fail_on_unmatched_files: true
