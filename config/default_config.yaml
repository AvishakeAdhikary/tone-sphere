# ToneSphere Configuration File
# Professional Audio Routing Engine Settings

# Audio Engine Configuration
engine:
  sample_rate: 48000

  # Frames per audio callback. Smaller means lower latency and less margin before a
  # dropout. Measured round trip on WASAPI exclusive: 128 frames -> 5.7 ms.
  # Raise to 256 or 512 if you hear crackling (check `xruns` in the status bar).
  buffer_size: 128

  # Audio backend. 'auto' picks the lowest-latency one that has devices.
  #   Windows: wasapi, wdmks, directsound, mme  (asio only if you supply a
  #            PortAudio built against the ASIO SDK, which cannot be redistributed)
  #   Linux:   alsa, jack        macOS: coreaudio, jack
  preferred_driver: 'auto'

  # Exclusive mode hands the device to ToneSphere and bypasses the OS mixer and its
  # resampling. Measured here: 8.3 ms exclusive vs 22 ms shared on the same device.
  # The cost is that no other application can use the device while ToneSphere holds it.
  exclusive_mode: true

# API Server Configuration
api:
  host: '127.0.0.1'        # API server host (use '0.0.0.0' for all interfaces)
  port: 8080                # API server port
  cors_enabled: true        # Enable CORS for web clients

# Network Audio Streaming Configuration
network:
  enabled: false            # Enable network audio streaming on startup
  port: 9001                # Network streaming port
  max_clients: 10           # Maximum concurrent clients

# Logging Configuration
logging:
  level: 'INFO'             # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  enable_file_logging: false # Enable logging to file
  log_file: 'tonesphere.log' # Log file name
  log_dir: 'logs'           # Log directory
  max_file_size_mb: 10      # Max log file size before rotation
  backup_count: 5           # Number of backup files to keep
  colored_console: true     # Use colored console output
  structured: false         # Use structured JSON logging
  
# Mix Buses (named "virtual_devices" for config compatibility)
#
# These are summing points INSIDE the ToneSphere process. They are not operating-system
# audio devices and cannot be selected from other applications — that needs a signed
# kernel-mode driver, which is Phase 5 on the roadmap.
virtual_devices:
  max_inputs: 10            # Maximum number of input buses
  max_outputs: 10           # Maximum number of output buses
  default_inputs: 0         # Buses created at startup (0: create them as you need them)
  default_outputs: 0
  
# Performance Monitoring
performance:
  monitoring_enabled: true  # Enable performance monitoring
  update_interval: 1.0      # Update interval in seconds